auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 744h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - user_id
            - user_email
    log_attributes:
      - action: index_label
        attributes:
          - user_id
          - user_email
      # event_name 은 의도적으로 index_label 에서 제외한다.
      # 모든 대시보드가 `| event_name = "..."` 파이프라인(structured metadata) 필터로 조회하므로
      # 인덱스로 승격할 이점이 없고, cardinality 만 늘린다. (README "Codex CLI 대시보드" 주석과 일치)

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
