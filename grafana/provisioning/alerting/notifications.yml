apiVersion: 1

# ──────────────────────────────────────────────────────────────────────────
# 알림 전송 경로(contact point / notification policy) — 현재 "비활성화" 상태.
#
# canary alert rule(claude-code-canary-rules.yml)은 평가/표시는 되지만,
# 이 파일이 비활성화되어 있어 실제 알림은 어디로도 전송되지 않습니다.
#
# 활성화하려면:
#   1) 아래 contactPoints / policies 블록의 주석을 해제하고
#   2) settings.url 을 본인 Slack/Discord/사내 webhook 주소로 교체한 뒤
#   3) Grafana 를 재기동하세요.
# (Slack Incoming Webhook: https://api.slack.com/messaging/webhooks)
# ──────────────────────────────────────────────────────────────────────────

# contactPoints:
#   - orgId: 1
#     name: cc-default
#     receivers:
#       - uid: cc-default-webhook
#         type: webhook
#         settings:
#           url: https://example.com/REPLACE-WITH-YOUR-WEBHOOK-URL
#           httpMethod: POST
#         disableResolveMessage: false
#
# policies:
#   - orgId: 1
#     receiver: cc-default
#     group_by:
#       - grafana_folder
#       - alertname
#     group_wait: 30s
#     group_interval: 5m
#     repeat_interval: 4h
#     routes:
#       - receiver: cc-default
#         matchers:
#           - team = observability
#         group_by:
#           - alertname
#           - signal
